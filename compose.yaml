services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kryacademia
      POSTGRES_USER: krya
      POSTGRES_PASSWORD: krya_dev_only
    ports:
      - "5432:5432"
    volumes:
      - kryacademia_postgres:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krya -d kryacademia"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  kryacademia_postgres:
